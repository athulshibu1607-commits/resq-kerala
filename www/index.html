<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>RESQ KERALA</title>
  <style>
    body {
      margin: 0;
      padding: 24px;
      background-color: #060D17;
      color: #FFFFFF;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      box-sizing: border-box;
      text-align: center;
    }
    .card {
      max-width: 400px;
      background: #0B1526;
      border: 1px solid #172A45;
      padding: 32px 24px;
      border-radius: 24px;
      box-shadow: 0 12px 32px rgba(0,0,0,0.5);
    }
    .logo {
      width: 72px;
      height: 72px;
      margin-bottom: 16px;
    }
    .spinner {
      width: 36px;
      height: 36px;
      border: 3px solid rgba(255,255,255,0.2);
      border-top-color: #EF4444;
      border-radius: 50%;
      animation: spin 1s linear infinite;
      margin: 20px auto;
    }
    @keyframes spin {
      to { transform: rotate(360deg); }
    }
    h1 {
      margin: 0 0 8px;
      font-size: 22px;
      font-weight: 800;
    }
    p {
      margin: 0;
      font-size: 13px;
      color: #94A3B8;
      line-height: 1.5;
    }
    .btn {
      display: inline-block;
      margin-top: 20px;
      padding: 12px 24px;
      background: #DC2626;
      color: #FFFFFF;
      font-weight: bold;
      border-radius: 12px;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <div class="card">
    <svg class="logo" viewBox="0 0 512 512" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect width="512" height="512" rx="128" fill="#0A192F"/>
      <path d="M256 96L128 176V336L256 416L384 336V176L256 96Z" stroke="#DC2626" stroke-width="24" stroke-linejoin="round"/>
      <path d="M256 160V352M160 256H352" stroke="#FFFFFF" stroke-width="32" stroke-linecap="round"/>
    </svg>
    <h1>RESQ KERALA</h1>
    <p>Connecting to Disaster Management Network...</p>
    <div class="spinner"></div>
    <div id="offline-msg" style="display:none;">
      <p style="color:#EF4444; margin-top:16px;">Cellular / Wi-Fi disconnected</p>
      <a href="tel:112" class="btn">Dial 112 (Kerala ERSS)</a>
    </div>
  </div>

  <script>
    setTimeout(function() {
      if (!navigator.onLine) {
        document.getElementById('offline-msg').style.display = 'block';
      }
    }, 4000);
  </script>
</body>
</html>
